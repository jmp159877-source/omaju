# firestore.rules 가 바뀌어 올라오면 Firebase에 자동 게시
name: firestore-rules
on:
  push:
    branches: [main]
    paths: ['firestore.rules']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q google-auth requests
      - name: 규칙 게시
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set +e
          python tools/deploy_rules.py > /tmp/rules.log 2>&1; rc=$?
          sed -E 's/(AIza|ya29\.)[A-Za-z0-9_\-]+/[키]/g' /tmp/rules.log > tools/last-rules.log
          cat tools/last-rules.log
          git config user.name omaju-bot; git config user.email bot@omaju.kr
          GITHUB_TOKEN=${{ github.token }} bash tools/push_logs.sh tools/last-rules.log
          exit $rc
