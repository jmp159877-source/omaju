# 노래 영상 고르기: 노래 목록이 바뀌면, 그리고 매일 새벽 4시에 남은 곡만
name: song-videos
on:
  push:
    branches: [main]
    paths: ['tools/songs.json']
  schedule:
    - cron: '20 8 * * *'   # 17:20 KST — 유튜브 하루 한도가 16시(KST)에 새로 채워진 직후
  workflow_dispatch:
    inputs:
      redo: { description: '이 노래만 다시 고르기 (제목|가수,제목|가수)', required: false, default: '' }
permissions:
  contents: write
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDO: ${{ inputs.redo }}
        run: |
          # 제목에 | 와 빈칸이 들어가므로 반드시 따옴표로 묶어 넘긴다 (2026-10-20: 따옴표가 없어 파이프로 잘려 실패)
          if [ -n "$REDO" ]; then python tools/song_videos.py --redo="$REDO"; else python tools/song_videos.py; fi
      - run: |
          git config user.name omaju-bot; git config user.email bot@omaju.kr
          cp tools/songs.json data/songs.json; git add data/song_videos.json data/songs.json; git diff --cached --quiet || git commit -m "노래 영상 목록 [skip ci]"
          ok=0; for i in 1 2 3 4 5; do git checkout -q -- . 2>/dev/null; git pull -q --rebase -X theirs origin main && git push && ok=1 && break; git rebase --abort 2>/dev/null; sleep 5; done; [ $ok = 1 ] || { echo '저장소에 올리지 못함'; exit 1; }
