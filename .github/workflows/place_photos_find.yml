name: 그해 그곳 사진 후보 모으기
# 서울연구원 경관기록사진을 통째로 훑어 data/photo-collections.json · data/place-photos.json 을 만든다. 손으로 돌린다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan = 컬렉션 목록, build = 사진 상세, probe = 모양 보기'
        required: true
        default: 'scan'
      range:
        description: '번호 범위 (scan: 컬렉션 id 예 1-1200 / build: 컬렉션 id, 비우면 전부)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 긁기
        env:
          MODE: ${{ github.event.inputs.mode }}
          RANGE: ${{ github.event.inputs.range }}
        run: |
          case "$MODE" in
            probe) python -u tools/place_photos_find.py --probe > /tmp/run.log 2>&1 || true ;;
            scan)  python -u tools/place_photos_find.py --scan "${RANGE:-1-1200}" > /tmp/run.log 2>&1 || true ;;
            *)     if [ -n "$RANGE" ]; then python -u tools/place_photos_find.py --build "$RANGE" > /tmp/run.log 2>&1 || true;
                   else python -u tools/place_photos_find.py --build > /tmp/run.log 2>&1 || true; fi ;;
          esac
          tail -120 /tmp/run.log
          cp /tmp/run.log tools/last-place-photos-find.log
      - name: 기록 올리기
        if: always()
        run: |
          git config user.name omaju-bot; git config user.email bot@omaju.kr
          git add data 2>/dev/null || true
          git commit -qm "그해 그곳 사진 후보 [skip ci]" || exit 0
          for i in 1 2 3; do git checkout -q -- . 2>/dev/null; git pull -q --rebase -X theirs origin main && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
          GITHUB_TOKEN=${{ github.token }} bash tools/push_logs.sh tools/last-place-photos-find.log
