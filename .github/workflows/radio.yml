# 장 음성 안내 '읽어 드려요': 장마다 오늘 올라온 것을 읽어 주는 3~5분짜리 → media 가지 (최근 3일만)
name: 읽어 드려요
on:
  schedule:
    - cron: '50 15 * * *'   # 00:50 KST (daily 콘텐츠가 들어온 뒤)
    - cron: '30 20 * * *'   # 05:30 KST (빠졌으면 다시)
  workflow_dispatch:
    inputs:
      date: { description: '날짜 (YYYY-MM-DD, 비우면 오늘)', required: false, default: '' }
      only: { description: '이 장만 (예: g1)', required: false, default: '' }
      force: { description: '1이면 있어도 다시 만들기', required: false, default: '' }
      chunk: { description: '한 토막 최대 글자수 (비우면 950)', required: false, default: '' }
permissions:
  contents: write
concurrency: { group: radio, cancel-in-progress: false }
jobs:
  radio:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: media 가지 가져오기
        run: |
          if git fetch -q origin media 2>/dev/null; then git worktree add -q media origin/media 2>/dev/null || (mkdir -p media && git --work-tree=media checkout origin/media -- .); else mkdir -p media/radio; fi
          ls media || true
      - name: 준비
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q numpy
      - name: 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEDIA_DIR: media
          CHUNK_MAX: ${{ inputs.chunk }}
        run: |
          set +o pipefail
          mkdir -p media/radio
          python3 -u tools/radio.py ${{ inputs.date }} ${{ inputs.only && format('--only={0}', inputs.only) || '' }} ${{ inputs.force == '1' && '--force' || '' }} 2>&1 | sed -E 's/key=[A-Za-z0-9_\-]+/key=[키]/g' | tail -200 | tee daily/last-radio.log
          code=${PIPESTATUS[0]}
          echo "--- 만들어진 것 ---" >> daily/last-radio.log
          ls -l media/radio >> daily/last-radio.log 2>&1 || echo '(radio 폴더 없음)' >> daily/last-radio.log
          exit $code
      - name: 기록 남기기
        if: always()
        run: |
          git config user.name omaju-bot; git config user.email bot@omaju.kr
          git add -A daily/last-radio.log 2>/dev/null || true
          git diff --cached --quiet || git commit -qm "읽어 드려요 기록 [skip ci]"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
      - name: media 가지에 올리기 (기록 없이 새로)
        if: always()
        run: |
          # 다른 작업(오프닝/읽어 드려요)이 그 사이에 올린 파일을 덮어쓰지 않게, 올리기 직전에 한 번 더 받아 와 합친다.
          # (기록 없이 새로 밀어 넣는 방식이라 이 과정이 없으면 서로의 결과가 지워진다)
          rm -rf /tmp/oldmedia && git clone -q --depth 1 --branch media "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/oldmedia 2>/dev/null || true
          if [ -d /tmp/oldmedia ]; then rm -rf /tmp/oldmedia/.git; cp -rn /tmp/oldmedia/. media/ 2>/dev/null || true; fi
          cd media
          rm -rf .git 2>/dev/null; git init -q -b media; git config user.name omaju-bot; git config user.email bot@omaju.kr
          git add -A && git commit -qm "읽어 드려요 $(date -u +%F) [skip ci]" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
