name: 오프닝 배경 음악 만들기
on:
  workflow_dispatch:
    inputs:
      takes:
        description: '슬롯마다 만들어 볼 횟수'
        required: false
        default: '3'
      only:
        description: '한 슬롯만 (morning|noon|evening)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAKES: ${{ inputs.takes }}
          ONLY: ${{ inputs.only }}
        run: |
          set +e
          python3 -u tools/music_make.py 2>&1 | sed -E 's/key=[A-Za-z0-9_\-]+/key=[키]/g' | tail -120
          echo "끝"
      - name: 고른 음악을 main 에 넣기
        run: |
          git config user.name omaju-bot; git config user.email bot@omaju.kr
          git add -A music || true
          git diff --cached --quiet || git commit -m "오프닝 배경 음악 [skip ci]"
          for i in 1 2 3; do git checkout -q -- . 2>/dev/null; git pull -q --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
      - name: 들어 본 것 모두 가지에 올리기
        if: always()
        run: |
          mkdir -p /tmp/m && cp out_music/* /tmp/m/ 2>/dev/null || true
          rm -f /tmp/m/_c.mp3
          git config user.name omaju-bot; git config user.email bot@omaju.kr
          git checkout --orphan music-try -f && git rm -rqf .
          cp /tmp/m/* . 2>/dev/null; true
          git add -A && git commit -qm "배경 음악 들어 본 것 [skip ci]" && git push -f origin music-try
