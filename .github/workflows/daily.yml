# 오마주 매일 콘텐츠: 한국 시간 자정 5분에 만들고, 못 만들었으면 1시·3시·6시에 다시 시도
name: daily-content
on:
  schedule:
    - cron: '5 15 * * *'   # 00:05 KST
    - cron: '0 16 * * *'   # 01:00 KST (보강)
    - cron: '0 18 * * *'   # 03:00 KST (보강)
    - cron: '0 21 * * *'   # 06:00 KST (보강)
    - cron: '40 7 * * *'   # 16:40 KST (AI 하루 한도가 풀린 뒤 빠진 것 채우기)
  workflow_dispatch:
    inputs:
      date:
        description: '만들 날짜 (YYYY-MM-DD, 비우면 오늘)'
        required: false
      only:
        description: '이 코너만 다시 (예: follow,phrase)'
        required: false
      force:
        description: '이미 있어도 다시 만들기 (yes)'
        required: false
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q google-cloud-firestore
      - name: 콘텐츠 만들기 (나들이 제외)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          ARGS="${{ github.event.inputs.date }}"
          if [ "${{ github.event.inputs.force }}" = "yes" ]; then ARGS="$ARGS --force"; fi
          ONLY="${{ github.event.inputs.only }}"; if [ -z "$ONLY" ]; then ONLY="greetings,fortune,era,mind,body,book,meal,quiz,story,follow,phrase,culture"; fi
          set +e
          timeout 45m python -u tools/gen_daily.py $ARGS --only=$ONLY 2>&1 | tee /tmp/daily.log; rc=${PIPESTATUS[0]}
          mkdir -p daily; sed -E 's/key=[A-Za-z0-9_\-]+/key=[키]/g' /tmp/daily.log | tail -300 > daily/last-run.log
          exit $rc
      - name: 그해 오늘 사진 빠진 것 채우기
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python tools/era_photos.py "${{ github.event.inputs.date || '' }}$( [ -z "${{ github.event.inputs.date }}" ] && TZ=Asia/Seoul date +%F )" || true
      - name: 만든 내용을 저장소에 기록
        if: always()
        run: |
          git config user.name "omaju-bot"; git config user.email "bot@omaju.kr"
          git add daily/ || true
          git diff --cached --quiet || git commit -m "오늘의 콘텐츠 기록 [skip ci]"
          ok=0; for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push && ok=1 && break; git rebase --abort 2>/dev/null; sleep 5; done; [ $ok = 1 ] || { echo '저장소에 올리지 못함'; exit 1; }
