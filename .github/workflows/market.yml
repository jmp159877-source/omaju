# 오마주 오늘의 시세: 평일 장중(한국 09~16시)은 10분마다, 그 밖(06~23시)은 매시 갱신
name: market
on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'       # 평일 KST 09:00~15:50, 10분마다 (장중)
    - cron: '10 7-14,21-23 * * *'   # KST 06~08시, 16~23시 매시
    - cron: '10 0-6 * * 0,6'        # 주말 낮 매시
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q google-cloud-firestore
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SAVE_LOG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python tools/market.py
      - if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "omaju-bot"; git config user.email "bot@omaju.kr"
          GITHUB_TOKEN=${{ github.token }} bash tools/push_logs.sh tools/last-market.json
