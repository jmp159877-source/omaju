# 오마주 오늘의 시세: 평일 장중(한국 09~16시) 매시, 그 밖 하루 세 번
#
# 2026-10-22: 10분마다로 걸어 두었더니 깃허브가 거의 다 건너뛰어 하루 네 번밖에 안 돌았다
# (운영자: 11시인데 8시 58분 숫자). 예약을 촘촘히 걸수록 통째로 버려진다 —
# 성글게 걸어야 실제로 그때그때 돈다. 하루 58번 요청을 11번으로 줄였다.
# 같은 날 오후: 정각(0분)에 걸었더니 12·13·14시가 한 번도 안 돌았다. 정각은 전 세계 예약이 몰려
# 깃허브가 늦추거나 버린다 → 13분으로 옮김.
name: market
on:
  schedule:
    - cron: '13 0-7 * * 1-5'  # 평일 KST 09~16시 매시 13분 (장중)
    - cron: '13 21 * * *'     # KST 06:13
    - cron: '13 9 * * *'      # KST 18:13
    - cron: '13 12 * * *'     # KST 21:13
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q google-cloud-firestore
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SAVE_LOG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python tools/market.py
      - if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "omaju-bot"; git config user.email "bot@omaju.kr"
          GITHUB_TOKEN=${{ github.token }} bash tools/push_logs.sh tools/last-market.json
