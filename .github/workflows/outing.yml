# 이번 주말 나들이: 주 단위로 지역별로 쌓는다(data/outing.json). 아직 없는 지역만 하루 몇 번 나눠 채움.
name: outing
on:
  schedule:
    - cron: '30 8 * * *'    # 17:30 KST  (AI 하루 한도가 새로 채워진 직후)
    - cron: '30 11 * * *'   # 20:30 KST
    - cron: '10 16 * * *'   # 01:10 KST
  workflow_dispatch:
    inputs:
      limit:
        description: '한 번에 만들 지역 수 (기본 9)'
        required: false
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 나들이 채우기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '9' }}
        run: |
          set +e
          timeout 35m python -u tools/outing_week.py 2>&1 | sed -E 's/key=[A-Za-z0-9_\-]+/key=[키]/g' | tail -200 | tee daily/last-outing.log
      - name: 기록
        if: always()
        run: |
          git config user.name "omaju-bot"; git config user.email "bot@omaju.kr"
          git add -A data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "이번 주말 나들이 [skip ci]"
          ok=0; for i in 1 2 3 4 5; do git checkout -q -- . 2>/dev/null; git pull -q --rebase -X theirs origin main && git push && ok=1 && break; git rebase --abort 2>/dev/null; sleep 5; done; [ $ok = 1 ] || { echo '저장소에 올리지 못함'; exit 1; }
          GITHUB_TOKEN=${{ github.token }} bash tools/push_logs.sh daily/last-outing.log
