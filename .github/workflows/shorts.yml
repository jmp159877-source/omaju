# 유튜브 쇼츠 (대표 2026-10-23): 그날 오프닝·인사 카드로 세로 영상 두 편 → media 가지 shorts/ (최근 5일)
# 매일 02:20 (오프닝이 다 된 뒤) · 보강 04:50 — Vercel 예약(api/tick.js)이 깨운다. 오늘치가 이미 있으면 건너뛴다.
name: 유튜브 쇼츠
on:
  workflow_dispatch:
    inputs:
      date:
        description: '날짜 (YYYY-MM-DD, 비우면 오늘)'
        required: false
        default: ''
      force:
        description: '1이면 있어도 다시 만들기'
        required: false
        default: ''
permissions:
  contents: write
concurrency: { group: shorts, cancel-in-progress: false }
jobs:
  shorts:
    runs-on: ubuntu-24.04   # 2026-10-26 밤부터 ubuntu-latest(26 으로 옮겨 가는 중)에서 apt 가 8분을 넘겨 쇼츠가 세 번 실패 — 판을 고정
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: media 가지 가져오기
        run: |
          if git fetch -q origin media 2>/dev/null; then git worktree add -q media origin/media 2>/dev/null || (mkdir -p media && git --work-tree=media checkout origin/media -- .); else mkdir -p media; fi
      - name: 준비 — 글꼴·ffmpeg
        timeout-minutes: 6
        # 2026-10-27: apt 가 14분을 넘겨도 끝나지 않아(우분투 저장소 문제) 쇼츠가 네 번 실패 — apt 없이 받는다.
        # ffmpeg 는 BtbN 정적 빌드, 나눔 글꼴은 구글 폰트 저장소(OFL)에서.
        run: |
          set -e
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/ && ffmpeg -version | head -1
          mkdir -p ~/.local/share/fonts && cd ~/.local/share/fonts
          G=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in nanummyeongjo/NanumMyeongjo-Regular nanummyeongjo/NanumMyeongjo-Bold nanummyeongjo/NanumMyeongjo-ExtraBold nanumgothic/NanumGothic-Regular nanumgothic/NanumGothic-Bold nanumgothic/NanumGothic-ExtraBold; do
            curl -fsSL --retry 3 -O "$G/$f.ttf"
          done
          fc-cache -f >/dev/null; fc-list | grep -i nanum | head -6
      - name: 준비 — 파이썬·크롬 조종
        timeout-minutes: 5
        run: |
          pip install -q pillow numpy
          cd tools && npm init -y >/dev/null && npm i --no-audit --no-fund puppeteer-core@23
          which google-chrome || ls /usr/bin | grep -i chrom
      - name: 만들기
        timeout-minutes: 25   # 한 끼 쇼츠가 붙어 5분쯤 더 걸린다
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEDIA_DIR: media
          CARDS: /tmp/cards
        run: |
          D="${{ inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Seoul date +%F)
          node tools/shorts_cards.mjs "$D" /tmp/cards || echo '카드 그림 실패 — 오프닝만'
          python3 -u tools/shorts.py "$D" ${{ inputs.force == '1' && '--force' || '' }}
          # ③ 오늘의 한 끼 (대표 2026-10-24) — 실패해도 카드·오프닝은 그대로 올라가게
          python3 -u tools/shorts_meal.py "$D" ${{ inputs.force == '1' && '--force' || '' }} || echo '한 끼 쇼츠 실패'
          ls -la media/shorts
      - name: 유튜브에 예약 게시 (열쇠가 있을 때만)
        timeout-minutes: 15
        env:
          MEDIA_DIR: media
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          D="${{ inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Seoul date +%F)
          mkdir -p media/shorts
          python3 -u tools/yt_upload.py "$D" 2>&1 | tee media/shorts/yt_last.log || true   # 기록을 media 에 남긴다(작업 기록은 밖에서 못 받는다, 2026-10-27)
          grep -q "올림\|이미 올림" media/shorts/yt_last.log || echo "::warning title=유튜브::올린 영상 없음 — media shorts/yt_last.log 확인"
      - name: media 가지에 올리기 (기록 없이 새로)
        run: |
          rm -rf /tmp/oldmedia && git clone -q --depth 1 --branch media "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/oldmedia 2>/dev/null || true
          if [ -d /tmp/oldmedia ]; then rm -rf /tmp/oldmedia/.git; cp -rn /tmp/oldmedia/. media/ 2>/dev/null || true; fi
          cd media
          rm -rf .git 2>/dev/null; git init -q -b media; git config user.name omaju-bot; git config user.email bot@omaju.kr
          printf '%s\n' '{ "git": { "deploymentEnabled": false } }' > vercel.json; git add -A && git commit -qm "쇼츠 $(date -u +%F) [skip ci]" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
