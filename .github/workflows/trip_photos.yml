# 여행·오늘의 산 칸마다 어울리는 무료 사진(Pixabay) 한 장씩 → trip-photos 가지
name: 여행·산 사진
on:
  schedule:
    # 본 예약은 Vercel 정시(api/tick.js): 일 23:40 KST (여행·산이 돈 뒤, 대표 2026-10-24)
    - cron: '30 17 * * 0'   # 월 02:30 KST (보강)
  workflow_dispatch:
    inputs:
      what: { description: 'travel | hike | all', required: false, default: 'all' }
      force: { description: '이미 있는 것도 다시 고르기 (1)', required: false, default: '0' }
permissions: { contents: write }
concurrency: { group: trip-photos, cancel-in-progress: false }
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pillow
      - name: 사진 모으기
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PHOTO_OUT: /tmp/trip-out
          FORCE: "${{ inputs.force || '0' }}"
        run: |
          set +e
          python3 -u tools/trip_photos.py "${{ inputs.what || 'all' }}" 2>&1 | sed -E 's/key=[A-Za-z0-9_\-]+/key=[키]/g' | tail -200 | tee daily/last-trip-photos.log
          ls -l /tmp/trip-out | tail -5
      - name: 목록 올리기 (main)
        run: |
          git config user.name omaju-bot; git config user.email bot@omaju.kr
          git add data/trip_photos.json 2>/dev/null || true
          git diff --cached --quiet || git commit -qm "여행·산 사진 목록 [skip ci]"
          for i in 1 2 3; do git checkout -q -- . 2>/dev/null; git pull -q --rebase -X theirs origin main && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
          GITHUB_TOKEN=${{ github.token }} bash tools/push_logs.sh daily/last-trip-photos.log
      - name: 사진 올리기 (trip-photos 가지, 기록 없이 새로)
        run: |
          # 지난번 사진을 먼저 받아 와 합친다 — 이번에 못 구한 칸의 사진이 사라지지 않게
          rm -rf /tmp/oldtrip && git clone -q --depth 1 --branch trip-photos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/oldtrip || true
          if [ -d /tmp/oldtrip ]; then rm -rf /tmp/oldtrip/.git; cp -rn /tmp/oldtrip/. /tmp/trip-out/ 2>/dev/null || true; fi
          ls /tmp/trip-out/*.jpg >/dev/null 2>&1 || { echo "사진이 하나도 없어 올리지 않음"; exit 0; }
          cd /tmp/trip-out && git init -q -b trip-photos && git config user.name omaju-bot && git config user.email bot@omaju.kr
          printf '%s\n' '{ "git": { "deploymentEnabled": false } }' > vercel.json; git add -A && git commit -qm "여행·산 사진 $(date -u +%F) [skip ci]" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" trip-photos
