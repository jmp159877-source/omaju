# 오마주 오늘의 이슈: 하루 네 번(한국 05:10·11:40·16:40·20:40) Firestore settings/issues 에 저장.
# 커밋을 남기지 않으므로 올리기(배포)와 무관하게 갱신된다.
# 첫 번째를 05:10 에 두는 까닭: 05:30 '읽어 드려요'가 그날 아침 것을 읽을 수 있게.
name: issues
on:
  schedule:
    - cron: '10 20 * * *'          # KST 05:10
    - cron: '40 2,7,11 * * *'      # KST 11:40 / 16:40 / 20:40
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q google-cloud-firestore
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # pipefail: 이게 없으면 issues.py 가 실패해도 sed 가 성공해 '성공'으로 보인다(2026-10-26 07:28·11:40 이 그렇게 조용히 빠졌다)
        run: set -o pipefail; python3 -u tools/issues.py 2>&1 | sed -E 's/key=[A-Za-z0-9_\-]+/key=[키]/g'
      - name: 창간 독자 번호
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 tools/founder.py || true
