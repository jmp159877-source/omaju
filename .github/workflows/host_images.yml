name: 진행자 사진 만들기
on:
  workflow_dispatch:
    inputs:
      only:
        description: '다시 만들 사진 이름 (쉼표로)'
        required: false
        default: ''
      set:
        description: 'evening 이면 저녁판'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: host-assets
      - name: 만들기 도구 가져오기
        run: git fetch -q origin main && git show origin/main:tools/host_images.py > /tmp/host_images.py
      - name: 사진 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ inputs.only }}
          SET: ${{ inputs.set }}
        run: python3 /tmp/host_images.py
      - name: 결과 올리기
        if: always()
        run: |
          git config user.name omaju-bot; git config user.email bot@omaju.kr
          git add out && git commit -qm "진행자 사진 [skip ci]" && git push -q origin host-assets || true
